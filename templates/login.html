<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ app_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-lg p-4 style-card" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <i class="fa fa-cubes fa-3x text-primary mb-2"></i>
            <h3 class="fw-bold text-dark">{{ app_name }}</h3>
            <p class="text-muted small">Sign in to access reporting and workflow management</p>
        </div>

        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="username" class="form-label font-weight-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-user"></i></span>
                    <input type="text" class="form-control" id="username" required placeholder="admin">
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label font-weight-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">
                <i class="fa fa-sign-in me-1"></i>Sign In
            </button>
        </form>

        <!-- 2FA Verification Form (Hidden by default) -->
        <form id="twoFaForm" class="d-none" onsubmit="handle2FA(event)">
            <div class="alert alert-info small" id="twoFaMsg">Enter OTP sent to your registered device.</div>
            <div class="mb-3">
                <label for="otp" class="form-label font-weight-bold">6-Digit OTP Code</label>
                <input type="text" class="form-control text-center font-monospace fs-4" id="otp" maxlength="6" required placeholder="000000">
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-2">
                Verify OTP & Login
            </button>
        </form>

        <div class="text-center border-top pt-3">
            <a href="#" class="small text-decoration-none" onclick="showRegisterModal()">Create an Account</a>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fa fa-user-plus me-2"></i>Create New Account</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm" onsubmit="handleRegister(event)">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="regUser" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="regEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="regFullName" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="regPwd" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.add('d-none');

            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });

            const data = await res.json();
            if (!data.success) {
                alertBox.innerText = data.message;
                alertBox.classList.remove('d-none');
                return;
            }

            if (data.require_2fa) {
                document.getElementById('loginForm').classList.add('d-none');
                document.getElementById('twoFaForm').classList.remove('d-none');
                document.getElementById('twoFaMsg').innerText = data.message;
                return;
            }

            window.location.href = data.redirect || '/dashboard';
        }

        async function handle2FA(e) {
            e.preventDefault();
            const res = await fetch('/verify-2fa', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    otp: document.getElementById('otp').value
                })
            });

            const data = await res.json();
            if (!data.success) {
                alert(data.message);
                return;
            }
            window.location.href = data.redirect || '/dashboard';
        }

        function showRegisterModal() {
            new bootstrap.Modal(document.getElementById('registerModal')).show();
        }

        async function handleRegister(e) {
            e.preventDefault();
            const res = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('regUser').value,
                    email: document.getElementById('regEmail').value,
                    full_name: document.getElementById('regFullName').value,
                    password: document.getElementById('regPwd').value
                })
            });

            const data = await res.json();
            alert(data.message);
            if (data.success) {
                location.reload();
            }
        }
    </script>
</body>
</html>
