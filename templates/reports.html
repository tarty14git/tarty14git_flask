<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dynamic Reports - Enterprise Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard"><i class="fa fa-cubes me-2"></i>CTH Enterprise Portal</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard"><i class="fa fa-dashboard me-1"></i>Dashboard</a>
                <a class="nav-link active" href="/reports/view"><i class="fa fa-table me-1"></i>Report Generator</a>
                <a class="nav-link" href="/apidocs/" target="_blank"><i class="fa fa-code me-1"></i>Swagger API</a>
                <a class="nav-link text-danger" href="/logout"><i class="fa fa-sign-out me-1"></i>Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Sidebar / Control Panel -->
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white font-weight-bold">
                        <i class="fa fa-sliders me-2"></i>Configurable Report Builder
                    </div>
                    <div class="card-body">
                        <form id="reportForm">
                            <div class="mb-3">
                                <label for="tableSelect" class="form-label font-weight-bold">Select Database Table</label>
                                <select id="tableSelect" class="form-select" onchange="loadColumns(this.value)">
                                    <option value="">-- Choose Table --</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label font-weight-bold">Select Fields / Columns</label>
                                <div id="fieldsContainer" class="border rounded p-2 bg-white" style="max-height: 180px; overflow-y: auto;">
                                    <small class="text-muted">Select a table first...</small>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="whereClause" class="form-label font-weight-bold">Filter Condition (WHERE Clause)</label>
                                <input type="text" id="whereClause" class="form-control" placeholder="e.g. is_admin = 1 or is_locked = 0">
                            </div>

                            <div class="mb-3">
                                <label for="orderBy" class="form-label font-weight-bold">Order By</label>
                                <input type="text" id="orderBy" class="form-control" placeholder="e.g. created_at DESC">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-primary" onclick="generateReport()">
                                    <i class="fa fa-play me-1"></i>Execute & View Report
                                </button>
                                <div class="btn-group">
                                    <button type="button" class="btn btn-outline-success" onclick="exportReport('excel')">
                                        <i class="fa fa-file-excel-o me-1"></i>Export Excel
                                    </button>
                                    <button type="button" class="btn btn-outline-info" onclick="exportReport('csv')">
                                        <i class="fa fa-file-text-o me-1"></i>Export CSV
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Saved Configurations -->
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        <i class="fa fa-bookmark me-2"></i>Saved Report Configurations
                    </div>
                    <div class="card-body p-0">
                        <ul id="savedReportsList" class="list-group list-group-flush">
                            <li class="list-group-item text-muted">No saved reports found.</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Main Display Panel -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <span><i class="fa fa-list-alt me-2"></i>Online Report Data View</span>
                        <span id="recordCount" class="badge bg-info">0 Records</span>
                    </div>
                    <div class="card-body p-3">
                        <div id="querySqlContainer" class="alert alert-secondary p-2 small font-monospace d-none"></div>

                        <div class="table-responsive" style="max-height: 550px;">
                            <table id="reportTable" class="table table-striped table-hover table-bordered small">
                                <thead class="table-dark" id="reportHeader">
                                    <tr><th>No data available. Execute a query on the left.</th></tr>
                                </thead>
                                <tbody id="reportBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadTables();
            loadSavedConfigs();
        });

        async function loadTables() {
            const res = await fetch('/api/metadata/tables');
            const data = await res.json();
            if (data.success) {
                const select = document.getElementById('tableSelect');
                select.innerHTML = '<option value="">-- Choose Table --</option>';
                data.tables.forEach(t => {
                    select.innerHTML += `<option value="${t}">${t}</option>`;
                });
            }
        }

        async function loadColumns(tableName) {
            const container = document.getElementById('fieldsContainer');
            if (!tableName) {
                container.innerHTML = '<small class="text-muted">Select a table first...</small>';
                return;
            }

            const res = await fetch(`/api/metadata/tables/${tableName}/columns`);
            const data = await res.json();
            if (data.success) {
                container.innerHTML = `<div class="form-check">
                    <input class="form-check-input" type="checkbox" id="selectAll" onchange="toggleAllFields(this)">
                    <label class="form-check-label fw-bold" for="selectAll">Select All</label>
                </div><hr class="my-1">`;
                data.columns.forEach(col => {
                    container.innerHTML += `
                        <div class="form-check">
                            <input class="form-check-input field-checkbox" type="checkbox" value="${col.name}" id="col_${col.name}" checked>
                            <label class="form-check-label" for="col_${col.name}">${col.name} <small class="text-muted">(${col.type})</small></label>
                        </div>
                    `;
                });
            }
        }

        function toggleAllFields(master) {
            document.querySelectorAll('.field-checkbox').forEach(cb => cb.checked = master.checked);
        }

        function getSelectedFields() {
            const checked = document.querySelectorAll('.field-checkbox:checked');
            return Array.from(checked).map(c => c.value);
        }

        async function generateReport() {
            const table = document.getElementById('tableSelect').value;
            const fields = getSelectedFields();
            const where_clause = document.getElementById('whereClause').value;
            const order_by = document.getElementById('orderBy').value;

            if (!table || fields.length === 0) {
                alert('Please select a table and at least one field.');
                return;
            }

            const res = await fetch('/api/reports/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({table_name: table, fields, where_clause, order_by})
            });

            const data = await res.json();
            if (!data.success) {
                alert(data.message);
                return;
            }

            document.getElementById('recordCount').innerText = `${data.data.length} Records`;
            const sqlBox = document.getElementById('querySqlContainer');
            sqlBox.innerText = `Executed SQL: ${data.sql}`;
            sqlBox.classList.remove('d-none');

            // Render Table Header
            const thead = document.getElementById('reportHeader');
            thead.innerHTML = '<tr>' + data.columns.map(c => `<th>${c}</th>`).join('') + '</tr>';

            // Render Table Body
            const tbody = document.getElementById('reportBody');
            tbody.innerHTML = '';
            data.data.forEach(row => {
                let tr = '<tr>';
                data.columns.forEach(col => {
                    tr += `<td>${row[col] !== null ? row[col] : ''}</td>`;
                });
                tr += '</tr>';
                tbody.innerHTML += tr;
            });
        }

        async function exportReport(format) {
            const table = document.getElementById('tableSelect').value;
            const fields = getSelectedFields();
            const where_clause = document.getElementById('whereClause').value;
            const order_by = document.getElementById('orderBy').value;

            if (!table || fields.length === 0) {
                alert('Please select a table and fields to export.');
                return;
            }

            const res = await fetch('/api/reports/export', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({table_name: table, fields, where_clause, order_by, format})
            });

            if (res.ok) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${table}_report.${format === 'csv' ? 'csv' : 'xlsx'}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            } else {
                alert('Export failed.');
            }
        }

        async function loadSavedConfigs() {
            const res = await fetch('/api/reports/config');
            const data = await res.json();
            if (data.success && data.reports.length > 0) {
                const list = document.getElementById('savedReportsList');
                list.innerHTML = '';
                data.reports.forEach(r => {
                    list.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center small">
                            <div>
                                <strong>${r.name}</strong><br>
                                <small class="text-muted">Table: ${r.table_name}</small>
                            </div>
                            <button class="btn btn-sm btn-outline-primary" onclick="loadConfig('${r.table_name}', '${r.where_clause}', '${r.order_by}')">Load</button>
                        </li>
                    `;
                });
            }
        }

        function loadConfig(table, whereClause, orderBy) {
            document.getElementById('tableSelect').value = table;
            loadColumns(table);
            document.getElementById('whereClause').value = whereClause || '';
            document.getElementById('orderBy').value = orderBy || '';
        }
    </script>
</body>
</html>
