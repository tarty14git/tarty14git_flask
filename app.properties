# Enterprise Application Configuration Properties
app.name=Updated Test Portal
app.secret_key=super-secret-key-change-in-production

# Database Configuration
# Supported db.type values: sqlite, postgresql, oracle, sqlserver
db.type=sqlite
db.host=localhost
db.port=5432
db.name=cth_report_db
db.user=cth_user
db.password=cth_password
db.sqlite_path=db/cth_app.db

# Authentication Configuration
# auth.ldap.enabled: true or false
auth.ldap.enabled=false
auth.ldap.server=ldap://localhost
auth.ldap.port=389
auth.ldap.base_dn=dc=example,dc=com
auth.ldap.user_dn_format=cn={username},dc=example,dc=com

# Two-Factor Authentication (SMS / Email)
# 2fa.enabled: false for demo purposes, can be toggled to true
2fa.enabled=false
2fa.method=email
